# ---------------------------------------------------------------------------
# CI for the kasm-aws-deployment child module.
#
#   fmt/validate  — formatting + config validity
#   boundary      — FR-7 gate: fail if any Kasm-internal value/pattern is present
#                   (this repo is the public-safe, customer-deliverable artifact)
#   publish       — publish to the GitLab Terraform Module Registry on semver tags
#                   so the parent wrapper (kasm-aws-multi-region-tf) can consume
#                   it as gitlab.com/kasm-technologies/kasm-aws-deployment/aws.
# ---------------------------------------------------------------------------

stages:
  - validate
  - boundary
  - publish

fmt_validate:
  stage: validate
  image: ghcr.io/opentofu/opentofu:1.11.6
  script:
    - tofu fmt -check -recursive
    - tofu init -backend=false -input=false
    - tofu validate
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# FR-7 boundary gate. Fails the pipeline if any Kasm-internal pattern appears in
# tracked sources. Keeps the child publishable / customer-deliverable.
boundary_check:
  stage: boundary
  image: alpine:latest
  script:
    - apk add --no-cache git grep
    - |
      PATTERNS='ocid1\.[a-z]+\.oc1|[[:space:]]721547778124[[:space:]]|1password\.(kasmweb|secops)|wazuh\.kasmweb|customerdeployments[0-9]|kasmhadeployments'
      # Scan tracked .tf / .tfvars (allow *.example placeholders).
      FILES=$(git ls-files '*.tf' '*.tfvars' | grep -v '\.example$' || true)
      if [ -n "$FILES" ] && echo "$FILES" | xargs grep -nEH "$PATTERNS" ; then
        echo "ERROR: Kasm-internal pattern found in child source (see matches above)."
        echo "Internal values belong only in the parent wrapper (kasm-aws-multi-region-tf)."
        exit 1
      fi
      echo "Boundary check passed: no internal patterns in child source."
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Publish to the GitLab Terraform Module Registry on a semver tag (v1.2.3).
# Reference pattern: kasm-oci-multi-region-tf/.gitlab-ci.yml (publish_addon_module).
publish_module:
  stage: publish
  image: curlimages/curl:latest
  variables:
    TERRAFORM_MODULE_DIR: ${CI_PROJECT_DIR}
    TERRAFORM_MODULE_NAME: kasm-aws-deployment
    TERRAFORM_MODULE_SYSTEM: aws
  script:
    - TERRAFORM_MODULE_NAME=$(echo "${TERRAFORM_MODULE_NAME}" | tr " _" -)
    # The registry rejects a leading `v`, so a `v1.0.0` tag publishes as `1.0.0`.
    - TERRAFORM_MODULE_VERSION="${CI_COMMIT_TAG#v}"
    - tar -vczf /tmp/${TERRAFORM_MODULE_NAME}-${TERRAFORM_MODULE_SYSTEM}-${TERRAFORM_MODULE_VERSION}.tgz -C ${TERRAFORM_MODULE_DIR} --exclude=./.git .
    - 'curl --fail-with-body --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
         --upload-file /tmp/${TERRAFORM_MODULE_NAME}-${TERRAFORM_MODULE_SYSTEM}-${TERRAFORM_MODULE_VERSION}.tgz
         ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/terraform/modules/${TERRAFORM_MODULE_NAME}/${TERRAFORM_MODULE_SYSTEM}/${TERRAFORM_MODULE_VERSION}/file'
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
