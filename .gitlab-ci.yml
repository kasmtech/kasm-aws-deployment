# ---------------------------------------------------------------------------
# CI for the kasm-aws-deployment module.
#
#   fmt/validate  — formatting + config validity
#   boundary      — fail if any value matching BOUNDARY_PATTERNS is present
#                   (this repo is published publicly)
#   publish       — publish to the GitLab Terraform Module Registry on bare semver
#                   tags (1.2.3, 1.2.3-1); tags with a `v` prefix are NOT published.
# ---------------------------------------------------------------------------

stages:
  - validate
  - boundary
  - publish

fmt_validate:
  stage: validate
  image:
    name: ghcr.io/opentofu/opentofu:1.11.10
    entrypoint: [""]
  script:
    - tofu fmt -check -recursive
    - tofu init -backend=false -input=false
    - tofu validate
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Boundary gate. Fails the pipeline if any blocked pattern appears in tracked
# sources, keeping the repository safe to publish.
boundary_check:
  stage: boundary
  image: alpine:latest
  script:
    - apk add --no-cache git grep
    - |
      # The pattern list is itself internal, so it lives in a masked/protected
      # CI/CD variable (Settings > CI/CD > Variables), never in this file.
      if [ -z "${BOUNDARY_PATTERNS:-}" ]; then
        echo "ERROR: BOUNDARY_PATTERNS CI/CD variable is not set; refusing to pass the boundary check."
        exit 1
      fi
      PATTERNS="$BOUNDARY_PATTERNS"
      # Scan tracked sources, scripts and docs (allow *.example placeholders).
      FILES=$(git ls-files '*.tf' '*.tfvars' '*.sh' '*.ps1' '*.md' '*.json' '*.yaml' '*.yml' | grep -v '\.example$' || true)
      if [ -n "$FILES" ] && echo "$FILES" | xargs grep -nEH "$PATTERNS" ; then
        echo "ERROR: blocked pattern found in tracked sources (see matches above)."
        exit 1
      fi
      echo "Boundary check passed: no blocked patterns found."
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Publish to the GitLab Terraform Module Registry on a bare semver tag (1.2.3 or
# 1.2.3-1). The tag is used verbatim as the module version; `v`-prefixed tags
# (v1.2.3) do not match the rule and are not published.
# The package is built with `git archive`, so only tracked files ship (never
# local state, tfvars or provider caches from the build directory).
publish_module:
  stage: publish
  image: alpine:latest
  variables:
    TERRAFORM_MODULE_NAME: kasm-aws-deployment
    TERRAFORM_MODULE_SYSTEM: aws
  script:
    - apk add --no-cache git curl
    - TERRAFORM_MODULE_NAME=$(echo "${TERRAFORM_MODULE_NAME}" | tr " _" -)
    - TERRAFORM_MODULE_VERSION="${CI_COMMIT_TAG}"
    - git archive --format=tar.gz --output=/tmp/${TERRAFORM_MODULE_NAME}-${TERRAFORM_MODULE_SYSTEM}-${TERRAFORM_MODULE_VERSION}.tgz "${CI_COMMIT_SHA}"
    - 'curl --fail-with-body --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
         --upload-file /tmp/${TERRAFORM_MODULE_NAME}-${TERRAFORM_MODULE_SYSTEM}-${TERRAFORM_MODULE_VERSION}.tgz
         ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/terraform/modules/${TERRAFORM_MODULE_NAME}/${TERRAFORM_MODULE_SYSTEM}/${TERRAFORM_MODULE_VERSION}/file'
  rules:
    - if: $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+/
